# xfeeds source registry
#
# This file is the ONLY place feeds are configured. Adding a source means adding
# an entry here plus (if the format is new) a parser in src/xfeeds/collectors/.
#
# independence_class: sources that share upstream data MUST share a class. The
#   scorer counts at most ONE vote per class, which is what stops composite
#   feeds from manufacturing fake corroboration. See docs/DECISIONS.md ADR-010.
# weight: contribution to confidence when this class votes (0..1).
# vote: false => the source may enrich or corroborate but never adds confidence.
# redistribute: false => data may inform scoring but MUST NOT appear in published
#   feeds. Enforced in emit/, not just documented.
#
# Verified reachable and parsed 2026-08-11. Counts are from that probe.

version: 1

defaults:
  timeout_seconds: 25
  user_agent: "xfeeds/2.0 (+https://github.com/neilweitzel/xfeeds)"
  retries: 3
  ttl_days: 14
  vote: true
  redistribute: true
  enabled: true

sources:

  # ---------------------------------------------------------------- netblocks
  - name: spamhaus_drop_v4
    url: https://www.spamhaus.org/drop/drop_v4.json
    parser: spamhaus_json
    independence_class: spamhaus
    weight: 1.0
    categories: [hijacked-netblock, criminal-hosting]
    ttl_days: 30
    min_interval_seconds: 3600   # Spamhaus: automated downloads >= 1h apart
    license: "Free to use; credit to The Spamhaus Project required, date and copy text must remain with the data"
    license_url: https://check.spamhaus.org/faqs/do-not-route-or-peer-drop/
    attribution_required: true
    notes: "1687 CIDRs / ~14.97M addresses. Highest-trust source. Auto-promotes to high confidence."

  - name: spamhaus_drop_v6
    url: https://www.spamhaus.org/drop/drop_v6.json
    parser: spamhaus_json
    independence_class: spamhaus
    weight: 1.0
    categories: [hijacked-netblock, criminal-hosting]
    ttl_days: 30
    min_interval_seconds: 3600
    license: "Free to use; attribution required"
    attribution_required: true
    notes: "92 IPv6 CIDRs."

  - name: spamhaus_asndrop
    url: https://www.spamhaus.org/drop/asndrop.json
    parser: spamhaus_asn_json
    independence_class: spamhaus
    weight: 0.5
    vote: false
    redistribute: false
    categories: [criminal-asn]
    enabled: false
    notes: "426 ASNs. DISABLED - annotation only in Phase 2a - we do not expand ASN to prefixes (needs BGP data, huge blast radius)."

  # ------------------------------------------------------- botnet C2 (precise)
  - name: feodo_tracker
    credit: "Feodo Tracker - abuse.ch (CC0)"
    url: https://feodotracker.abuse.ch/downloads/ipblocklist.txt
    parser: plain_text
    independence_class: abusech
    weight: 1.0
    categories: [botnet-c2]
    ttl_days: 7
    license: "abuse.ch - free, see terms"
    license_url: https://feodotracker.abuse.ch/blocklist/
    notes: >
      Only 5 IPs and header says last updated 2026-03-04 - effectively dormant.
      Tiny but near-zero false positive. Keep; do not rely on it for volume.
      A staleness warning must fire if last-updated header is >30d old.

  - name: sslbl
    url: https://sslbl.abuse.ch/blacklist/sslipblacklist.txt
    parser: plain_text
    independence_class: abusech
    weight: 1.0
    categories: [botnet-c2, malicious-tls]
    ttl_days: 7
    license_url: https://sslbl.abuse.ch/
    enabled: false
    vote: false
    notes: >
      DISABLED. The payload states "ATTENTION: This list has been deprecated on
      2025-01-03" and its last-updated header is frozen at 2025-01-02. Retired,
      not merely quiet. The abusech class is carried by feodo_tracker and threatfox.

  - name: threatfox
    credit: "ThreatFox - abuse.ch / Spamhaus - used for scoring only, not republished"
    noncommercial_compatible: false
    license_risk: high
    license_url: https://abuse.ch/terms-of-use/
    license: "abuse.ch/Spamhaus platform terms; no redistribution grant (NOT CC0, unlike Feodo Tracker)"
    redistribute: false
    url: https://threatfox-api.abuse.ch/api/v1/
    parser: threatfox_api
    method: POST
    auth: header
    auth_header: Auth-Key
    auth_secret: THREATFOX_AUTH_KEY
    params:
      query: get_iocs
      days: 7          # 7 is the maximum the API accepts
    independence_class: abusech
    weight: 1.0
    categories: [botnet-c2, malware-infrastructure]
    ttl_days: 7
    notes: >
      abuse.ch made authentication mandatory on 2025-06-30 across its APIs.
      Static /downloads/ paths still answer unauthenticated but that is not
      guaranteed - always send the free Auth-Key. Key is free from
      https://auth.abuse.ch/ . abuse.ch is now operated under Spamhaus.

  # ------------------------------------------------- primary attacker sensors
    notes: >
      Botnet C2 IOCs via API, requires THREATFOX_AUTH_KEY. Votes and corroborates but
      is NO LONGER REPUBLISHED, and can no longer promote on its own.
      Feodo Tracker is explicitly CC0; ThreatFox is NOT. The abuse.ch platform terms
      grant no redistribution right and state "You may not: copy, adapt, alter,
      translate, modify or make derivative works based on the Platforms ... without
      the express consent of abuse.ch and/or Spamhaus", with commercial use routed to
      a paid Spamhaus subscription. The export page carries no CC0 notice. ADR-030
      treated Feodo and ThreatFox as one licence; corrected in ADR-040.

  - name: blocklist_de
    credit: "Blocklist.de - fail2ban reporting community, blocklist.de"
    attribution_required: true
    url: https://lists.blocklist.de/lists/all.txt
    parser: plain_text
    independence_class: blocklist_de
    weight: 0.8
    categories: [brute-force, scanning, web-attack]
    ttl_days: 10
    license: "Free, non-commercial reporting service"
    license_url: https://blocklist.de/
    notes: "28,605 IPs. Largest genuinely independent sensor network (fail2ban reporters). Refreshes ~30m."

  - name: cins_army
    credit: "CINS Army List - Collective Intelligence Network Security, cinsscore.com"
    attribution_required: true
    url: https://cinsscore.com/list/ci-badguys.txt
    parser: plain_text
    independence_class: cins
    weight: 0.8
    categories: [scanning, brute-force]
    ttl_days: 10
    license: "No formal license published; site states the list is shared with the community to 'parse and use in any way you see fit'"
    license_url: https://cinsscore.com/#list
    license_risk: medium
    notes: >
      15,000 IPs, fixed-size list. No explicit redistribution grant - the stated
      intent is permissive but it is not a formal license. Attribute clearly and
      be prepared to drop on request. Tracked in docs/DECISIONS.md ADR-012.

  - name: greensnow
    credit: "GreenSnow.co - used for scoring only, not republished"
    noncommercial_compatible: false
    license_risk: high
    license: "All rights reserved; reproduction or republication strictly prohibited"
    redistribute: false
    url: https://blocklist.greensnow.co/greensnow.txt
    parser: plain_text
    independence_class: greensnow
    weight: 0.6
    categories: [brute-force, scanning]
    ttl_days: 10
    license_url: https://greensnow.co/
    notes: "3,595 IPs."
    notes: >
      3,587 IPs from SSH/FTP/web brute-force sensors. Still votes and can upgrade a
      band, but is NO LONGER REPUBLISHED. The site footer states verbatim:
      "Copyright (c) 2013-2026 GreenSnow.co. All rights reserved. Reproduction or
      republication strictly prohibited." We were republishing it. Corrected in
      ADR-040. Not eligible for the non-commercial tier either - the prohibition is
      on republication of any kind, not on commercial use.

  - name: binary_defense
    credit: "Artillery Threat Intelligence Feed - Binary Defense Systems, binarydefense.com"
    attribution_required: true
    license_url: https://www.binarydefense.com/banlist.txt
    url: https://www.binarydefense.com/banlist.txt
    parser: plain_text
    independence_class: binary_defense
    weight: 0.6
    categories: [scanning, malware-infrastructure]
    ttl_days: 10
    require_user_agent: true
    license: "Public use permitted; commercial resale and fee-charging products prohibited"
    license_risk: medium
    redistribute: true
    notes: >
      3,300 IPs. Returns 301 to an HTML page without a browser-like User-Agent -
      the collector MUST send the configured UA and MUST reject text/html responses.
      NOT redistributed. The terms are non-commercial, and we cannot impose that on
      downstream consumers of a public feed - the same reasoning already applied to
      stopforumspam_toxic. Corrected in ADR-036 after review found the two sources
      carried materially similar terms but opposite redistribute flags.
    notes: >
      3,544 IPs. Returns 301 to an HTML page without a browser-like User-Agent -
      the collector MUST send the configured UA and MUST reject text/html responses.
      REDISTRIBUTED. The feed header reads "Note that this is for public use only"
      and prohibits only "commercial resale or ... products that are charging fees",
      glossed as "(having others pay for a service)". There is no redistribution
      restriction. ADR-036 wrongly inferred one from the word "non-commercial";
      corrected in ADR-039 after reading the actual header text.

  - name: bruteforceblocker
    credit: "bruteforceblocker - Daniel Gerzo, danger.rulez.sk"
    attribution_required: true
    license_url: http://danger.rulez.sk/index.php/bruteforceblocker/
    license: "No licence stated. Published for public use by the bruteforceblocker project; we asked for an explicit statement (ADR-043)"
    url: https://danger.rulez.sk/projects/bruteforceblocker/blist.php
    parser: bruteforceblocker
    independence_class: bruteforceblocker
    weight: 0.6
    categories: [brute-force, ssh-attack]
    ttl_days: 10
    notes: "549 IPs. Tab-separated: ip, last-seen, count. Upstream of ET compromised-ips."

  - name: abuseipdb_blacklist
    url: https://api.abuseipdb.com/api/v2/blacklist
    parser: abuseipdb
    auth: header
    auth_header: Key
    auth_secret: ABUSEIPDB_API_KEY
    params:
      confidenceMinimum: 100    # free tier cannot lower this
      limit: 10000              # free tier hard cap
    independence_class: abuseipdb
    weight: 0.9
    categories: [reported-abuse]
    ttl_days: 10
    min_interval_seconds: 21600   # 5 blacklist calls/day on free tier -> 6h floor
    cache_response: true
    license: "AbuseIPDB free tier; redistribution of the blacklist is restricted"
    license_url: https://www.abuseipdb.com/legal
    redistribute: false
    enabled: false   # flip on once ABUSEIPDB_API_KEY is in repo secrets
    notes: >
      Free tier: 5 blacklist calls/day, 10,000 IPs, confidenceMinimum locked at 100.
      redistribute:false by default - AbuseIPDB terms restrict republishing their
      blacklist verbatim. Used as a scoring/corroboration signal only until the
      terms are confirmed in writing. See docs/DECISIONS.md ADR-012.

  - name: stopforumspam_toxic
    credit: "StopForumSpam toxic CIDR list - stopforumspam.com"
    redistribute_noncommercial: true
    url: https://www.stopforumspam.com/downloads/toxic_ip_cidr.txt
    parser: plain_text
    independence_class: stopforumspam
    weight: 0.5
    categories: [spam-source, abuse]
    ttl_days: 30
    license: "Non-commercial use only; Creative Commons for remaining terms"
    license_url: https://www.stopforumspam.com/legal
    license_risk: medium
    redistribute: false
    notes: >
      Toxic CIDR ranges - whole networks the operator considers irredeemable.
      Independent of the attack-sensor feeds. NOT redistributed: the terms
      require non-commercial use, which we cannot impose on downstream consumers
      of a public feed. Used as a scoring signal only.

  - name: ipthreat_30d
    credit: "Data sourced from IPThreat located at https://ipthreat.net"
    url: https://lists.ipthreat.net/file/ipthreat-lists/threat/threat-30.txt
    parser: ipthreat
    independence_class: ipthreat
    weight: 0.8
    categories: [reported-abuse, scanning]
    ttl_days: 10
    license: "Creative Commons attribution; derived data under the same CC licence; commercial use expressly permitted"
    license_url: https://ipthreat.net/license
    license_risk: low
    attribution_required: true
    noncommercial_compatible: false
    notes: >
      3,266 addresses at threat level 30 or above, from ipthreat.net's own community
      and honeypot reporting. Genuinely independent: 5.4% overlap with our published
      feed. Updated hourly despite the site describing monthly dumps, and each row
      carries its own threat level and timestamp.
      Licence expressly permits commercial reuse, which is rare in this space, and
      requires attribution: "Data sourced from IPThreat located at
      https://ipthreat.net". It also requires derived data under the same CC licence,
      i.e. ShareAlike. That is why noncommercial_compatible is false - CC BY-SA
      forbids adding restrictions to an adaptation, so this data may not be mixed
      into the CC BY-NC-SA tier. Use the threat-30 list rather than threat-14: the
      number is a minimum threat level, not a day count. See ADR-042.

  # ------------------------------------------ corroboration only (never votes)
    notes: >
      Toxic CIDR ranges - whole networks the operator considers irredeemable.
      Independent of the attack-sensor feeds. Not in the primary feed: the terms read
      "Your use of this data and supporting software is non-commercial" and "You will
      not charge money for any software that utilizes the data", with everything else
      "covered under a Creative Commons License" - no version named, and the page
      self-describes as a draft. Republished in the non-commercial tier only.

  - name: ipsum_levels
    credit: "IPsum - Miroslav Stampar (stamparm), github.com/stamparm/ipsum"
    attribution_required: true
    license_url: https://raw.githubusercontent.com/stamparm/ipsum/master/LICENSE
    license: "The Unlicense (public domain dedication)"
    url: https://raw.githubusercontent.com/stamparm/ipsum/master/levels/{level}.txt
    parser: ipsum_levels
    levels: [3, 4, 5, 6, 7, 8]
    independence_class: META_aggregate
    weight: 0.0
    vote: false
    categories: [aggregate]
    notes: >
      IPsum aggregates 30+ public lists including most of ours - counting it as a
      vote double-counts. Levels are strictly nested (verified: L8 subset of L5
      subset of L3) and the level number IS the upstream corroboration count.
      Used as a Bayesian prior only: level>=5 adds a bounded bonus, never a vote.
      Sizes: L3=17,078 L4=7,045 L5=2,092 L6=517 L7=131 L8=31.

  - name: firehol_level1
    url: https://iplists.firehol.org/files/firehol_level1.netset
    parser: netset
    independence_class: META_aggregate
    weight: 0.0
    vote: false
    redistribute: false
    categories: [aggregate]
    enabled: false
    notes: >
      DISABLED. Its own header declares it is composed of dshield + feodo +
      fullbogons + spamhaus_drop - every one already a direct source here.
      It also carries 224.0.0.0/3 (536,870,912 addresses, multicast/reserved)
      and 615 routable blocks wider than /22 totalling ~557M addresses.
      Blindly merging it would be catastrophic. Retained only as an optional
      offline cross-check. See docs/DECISIONS.md ADR-011.

  # ------------------------------------------------ excluded, kept documented
  - name: et_compromised
    url: https://rules.emergingthreats.net/blockrules/compromised-ips.txt
    parser: plain_text
    independence_class: bruteforceblocker   # same class - NOT independent
    weight: 0.0
    vote: false
    enabled: false
    notes: >
      DISABLED as a duplicate. Measured Jaccard 0.953 against bruteforceblocker
      (531 of 539 IPs identical). It is a mirror, not a second opinion.
      Class-pinned to bruteforceblocker so it can never double-vote if re-enabled.

  - name: dshield_block
    url: https://feeds.dshield.org/block.txt
    parser: dshield
    independence_class: dshield
    weight: 0.0
    vote: false
    redistribute: false
    enabled: false
    license: "CC BY-NC-SA 2.5"
    license_url: http://creativecommons.org/licenses/by-nc-sa/2.5/
    license_risk: high
    notes: >
      DISABLED on licensing grounds. The feed header declares CC BY-NC-SA 2.5.
      NonCommercial conflicts with unrestricted downstream use and ShareAlike
      would attach viral terms to any output containing it. Only 20 /24 blocks
      anyway. Excluded until relicensed or a separate NC-SA feed is justified.
      See docs/DECISIONS.md ADR-012.

  - name: turris_greylist
    credit: "Turris Sentinel greylist - CZ.NIC, view.sentinel.turris.cz (CC BY-NC-SA 4.0)"
    redistribute_noncommercial: true
    url: https://view.sentinel.turris.cz/greylist-data/greylist-latest.csv
    parser: turris_greylist
    independence_class: turris
    weight: 0.7
    categories: [brute-force, scanning]
    ttl_days: 7
    license: "CC BY-NC-SA 4.0"
    license_url: https://view.sentinel.turris.cz/greylist-data/LICENSE.txt
    license_risk: medium
    attribution_required: true
    redistribute: false
    notes: >
      ~9,700 addresses from the CZ.NIC Turris router sensor network. A genuinely
      different vantage point from the server-side honeypots that dominate the rest
      of the set: measured overlap with our published feed is only 7.7%, and it
      corroborates 477 of 1,837 medium-confidence records.
      Was disabled outright on licensing grounds (ADR-030). Re-enabled as a
      SCORING-ONLY source in ADR-035 once the vote/redistribute split was shown to
      contain the risk: CC BY-NC-SA ShareAlike attaches on *Sharing* adapted
      material, and we never share any of it. Three containments apply - the rows
      are never emitted, the source name is withheld from published records so the
      feed cannot disclose greylist membership, and a restricted class may only
      upgrade medium to high, never admit a record on its own.
    notes: >
      ~9,530 addresses from the CZ.NIC Turris consumer-router sensor network. A
      different vantage point from the server-side honeypots that dominate the rest
      of the set: 7.7% overlap with our published feed.
      NOT in the primary feed - CC BY-NC-SA cannot be imposed on consumers of a
      public feed. It corroborates there under ADR-035 (upgrade only, name withheld),
      and is republished in FULL in the non-commercial tier, which is itself licensed
      CC BY-NC-SA 4.0 with attribution. See ADR-041.

  - name: dataplane_sshpwauth
    url: https://dataplane.org/sshpwauth.txt
    parser: plain_text
    independence_class: dataplane
    weight: 0.0
    vote: false
    redistribute: false
    enabled: false
    license: "Non-commercial only; redistribution expressly prohibited"
    license_url: https://dataplane.org/
    license_risk: high
    notes: >
      DISABLED. The payload states "Redistribution of the sshpwauth report in
      whole or in part without the express permission of Dataplane.org is
      expressly prohibited." Not ingested at all - a compiled feed is arguably
      redistribution "in part", and this project will not test that argument.

  # ---------------------------------------------------- annotation, not blocks
  - name: tor_exits
    credit: "Tor exit relay list - The Tor Project, torproject.org"
    attribution_required: true
    license_url: https://check.torproject.org/torbulkexitlist
    license: "No licence stated on the endpoint. Published by the Tor Project as a public service"
    url: https://check.torproject.org/torbulkexitlist
    parser: plain_text
    independence_class: tor
    weight: 0.0
    vote: false
    tag_only: true
    categories: [tor-exit]
    ttl_days: 2
    notes: >
      1,367 exits. NEVER blocked, NEVER scored - tagged only. Measured
      contamination in other feeds: IPsum L3 lists 265 of them, binary_defense 64,
      blocklist_de 49, greensnow 48. Any IP tagged tor-exit is capped below the
      high-confidence threshold. See docs/DECISIONS.md ADR-013.

# ----------------------------------------------------------------- allowlists
# Fetched fresh each run and applied AFTER every other stage. A miss here is a
# customer-visible outage for somebody, so these are hard failures, not warnings.
allowlist_sources:
  - name: cloudflare
    url: https://api.cloudflare.com/client/v4/ips
    parser: cloudflare_json
  - name: google_cloud
    url: https://www.gstatic.com/ipranges/goog.json
    parser: google_json
  - name: googlebot
    url: https://developers.google.com/static/search/apis/ipranges/googlebot.json
    parser: google_json
  - name: bingbot
    url: https://www.bing.com/toolbox/bingbot.json
    parser: google_json
  - name: github
    url: https://api.github.com/meta
    parser: github_meta
  - name: static
    path: allowlist.txt
    parser: plain_text
    notes: "RFC1918, bogons, public resolvers (1.1.1.1 8.8.8.8 9.9.9.9), root/TLD DNS, manual entries."
