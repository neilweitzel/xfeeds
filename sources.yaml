# xfeeds source registry
#
# This file is the ONLY place feeds are configured. Adding a source means adding
# an entry here plus (if the format is new) a parser in src/xfeeds/collectors/.
#
# independence_class: sources that share upstream data MUST share a class. The
#   scorer counts at most ONE vote per class, which is what stops composite
#   feeds from manufacturing fake corroboration. See docs/DECISIONS.md ADR-010.
# weight: contribution to confidence when this class votes (0..1).
# vote: false => the source may enrich or corroborate but never adds confidence.
# redistribute: false => data may inform scoring but MUST NOT appear in published
#   feeds. Enforced in emit/, not just documented.
#
# Verified reachable and parsed 2026-08-11. Counts are from that probe.

version: 1

defaults:
  timeout_seconds: 25
  user_agent: "xfeeds/2.0 (+https://github.com/neilweitzel/xfeeds)"
  retries: 3
  ttl_days: 14
  vote: true
  redistribute: true
  enabled: true

sources:

  # ---------------------------------------------------------------- netblocks
  - name: spamhaus_drop_v4
    url: https://www.spamhaus.org/drop/drop_v4.json
    parser: spamhaus_json
    independence_class: spamhaus
    weight: 1.0
    categories: [hijacked-netblock, criminal-hosting]
    ttl_days: 30
    min_interval_seconds: 3600   # Spamhaus: automated downloads >= 1h apart
    license: "Free to use; credit to The Spamhaus Project required, date and copy text must remain with the data"
    license_url: https://check.spamhaus.org/faqs/do-not-route-or-peer-drop/
    attribution_required: true
    notes: "1687 CIDRs / ~14.97M addresses. Highest-trust source. Auto-promotes to high confidence."

  - name: spamhaus_drop_v6
    url: https://www.spamhaus.org/drop/drop_v6.json
    parser: spamhaus_json
    independence_class: spamhaus
    weight: 1.0
    categories: [hijacked-netblock, criminal-hosting]
    ttl_days: 30
    min_interval_seconds: 3600
    license: "Free to use; attribution required"
    attribution_required: true
    notes: "92 IPv6 CIDRs."

  - name: spamhaus_asndrop
    url: https://www.spamhaus.org/drop/asndrop.json
    parser: spamhaus_asn_json
    independence_class: spamhaus
    weight: 0.5
    vote: false
    redistribute: false
    categories: [criminal-asn]
    enabled: false
    notes: "426 ASNs. DISABLED - annotation only in Phase 2a - we do not expand ASN to prefixes (needs BGP data, huge blast radius)."

  # ------------------------------------------------------- botnet C2 (precise)
  - name: feodo_tracker
    credit: "Feodo Tracker - abuse.ch (CC0)"
    url: https://feodotracker.abuse.ch/downloads/ipblocklist.txt
    parser: plain_text
    explicit_grant: true   # CC0 - abuse.ch Feodo Tracker ToS: datasets usable commercially and non-commercially without limitations
    independence_class: abusech
    weight: 1.0
    categories: [botnet-c2]
    ttl_days: 7
    dormant: true   # ADR-052: tracked threat families dismantled by law enforcement.
                     # Stays enabled for corroboration and possible reactivation, but
                     # cannot solo-promote while dormant. Reactivation requires a
                     # maintainer review and removing this flag.
    license: "CC0 1.0 - Feodo Tracker ToS: all datasets usable for commercial and non-commercial purpose without any limitations"
    license_url: https://feodotracker.abuse.ch/blocklist/
    notes: >
      Only 5 IPs and header says last updated 2026-03-04. Re-audited 2026-08-15:
      that is ~163 days stale, not the ~43 previously recorded. abuse.ch's own FAQ
      explains it rather than it being a broken fetch - the families Feodo tracks
      (Emotet, Dridex, TrickBot, QakBot, BazarLoader) have almost no live C2 left
      after the 2021 Emotet takedown and Operation Endgame in 2024. No replacement
      endpoint exists.
      DORMANT per ADR-052 (2026-08-18). The tracked threat is confirmed inactive,
      so the source cannot solo-promote and the staleness warning is suppressed.
      It stays enabled for corroboration and will reactivate automatically if
      upstream publishes fresh data. Reactivation requires a maintainer review
      (licence, method, content shape) and removing dormant: true.

  - name: sslbl
    url: https://sslbl.abuse.ch/blacklist/sslipblacklist.txt
    parser: plain_text
    independence_class: abusech
    weight: 1.0
    categories: [botnet-c2, malicious-tls]
    ttl_days: 7
    license_url: https://sslbl.abuse.ch/
    enabled: false
    vote: false
    notes: >
      DISABLED. The payload states "ATTENTION: This list has been deprecated on
      2025-01-03" and its last-updated header is frozen at 2025-01-02. Retired,
      not merely quiet. The abusech class is carried by feodo_tracker and threatfox.
      Re-audited 2026-08-15: still frozen, and abuse.ch created no free replacement
      - that SSL/C2 capability moved into the paid Spamhaus/abuse.ch Real Time
      Feeds bundle. Do not re-enable and do not go looking for a successor URL.

  - name: threatfox
    credit: "ThreatFox - abuse.ch / Spamhaus - used for scoring only, not republished"
    noncommercial_compatible: false
    license_risk: high
    license_url: https://abuse.ch/terms-of-use/
    license: "abuse.ch/Spamhaus platform terms; no redistribution grant (NOT CC0, unlike Feodo Tracker)"
    redistribute: false
    url: https://threatfox-api.abuse.ch/api/v1/
    parser: threatfox_api
    method: POST
    auth: header
    auth_header: Auth-Key
    auth_secret: THREATFOX_AUTH_KEY
    params:
      query: get_iocs
      days: 7          # 7 is the maximum the API accepts
    independence_class: abusech
    weight: 1.0
    categories: [botnet-c2, malware-infrastructure]
    ttl_days: 7
    notes: >
      abuse.ch made authentication mandatory on 2025-06-30 across its APIs.
      Static /downloads/ paths still answer unauthenticated but that is not
      guaranteed - always send the free Auth-Key. Key is free from
      https://auth.abuse.ch/ . abuse.ch is now operated under Spamhaus.

  # ------------------------------------------------- primary attacker sensors
    notes: >
      Botnet C2 IOCs via API, requires THREATFOX_AUTH_KEY. Votes and corroborates but
      is NO LONGER REPUBLISHED, and can no longer promote on its own.
      Feodo Tracker is explicitly CC0; ThreatFox is NOT. The abuse.ch platform terms
      grant no redistribution right and state "You may not: copy, adapt, alter,
      translate, modify or make derivative works based on the Platforms ... without
      the express consent of abuse.ch and/or Spamhaus", with commercial use routed to
      a paid Spamhaus subscription. The export page carries no CC0 notice. ADR-030
      treated Feodo and ThreatFox as one licence; corrected in ADR-040.

  - name: blocklist_de
    credit: "Blocklist.de - fail2ban reporting community, blocklist.de"
    attribution_required: true
    url: https://lists.blocklist.de/lists/all.txt
    parser: plain_text
    independence_class: blocklist_de
    weight: 0.8
    categories: [brute-force, scanning, web-attack]
    ttl_days: 10
    license: "Free, non-commercial reporting service"
    license_url: https://blocklist.de/
    notes: >
      Largest genuinely independent sensor network (fail2ban reporters).
      Refreshes ~30m; entries age out after 48 hours.
      CARRIES IPv6. Measured 2026-08-15: 431 of ~25,000 lines are IPv6, as
      individual /128 hosts. They are parsed and scored today and every one is
      withheld, because nothing corroborates them - zero of the 431 fall inside a
      Spamhaus DROPv6 prefix, so the two IPv6 sources observe different phenomena
      (compromised hosts vs criminal-controlled allocations) and cannot corroborate
      each other. Publishing IPv6 from here needs a second REDISTRIBUTABLE source
      that also reports individual hosts. See docs/DECISIONS.md.

  - name: cins_army
    credit: "CINS Army List - Collective Intelligence Network Security, cinsscore.com"
    attribution_required: true
    url: https://cinsscore.com/list/ci-badguys.txt
    parser: plain_text
    independence_class: cins
    weight: 0.8
    categories: [scanning, brute-force]
    ttl_days: 10
    license: "No formal license published; site states the list is shared with the community to 'parse and use in any way you see fit'"
    license_url: https://cinsscore.com/#list
    license_risk: medium
    notes: >
      15,000 IPs, fixed-size list. No explicit redistribution grant - the stated
      intent is permissive but it is not a formal license. Attribute clearly and
      be prepared to drop on request. Tracked in docs/DECISIONS.md ADR-012.

  - name: greensnow
    credit: "GreenSnow.co - used for scoring only, not republished"
    noncommercial_compatible: false
    license_risk: high
    license: "All rights reserved; reproduction or republication strictly prohibited"
    redistribute: false
    url: https://blocklist.greensnow.co/greensnow.txt
    parser: plain_text
    independence_class: greensnow
    weight: 0.6
    categories: [brute-force, scanning]
    ttl_days: 10
    license_url: https://greensnow.co/
    notes: "3,595 IPs."
    notes: >
      3,587 IPs from SSH/FTP/web brute-force sensors. Still votes and can upgrade a
      band, but is NO LONGER REPUBLISHED. The site footer states verbatim:
      "Copyright (c) 2013-2026 GreenSnow.co. All rights reserved. Reproduction or
      republication strictly prohibited." We were republishing it. Corrected in
      ADR-040. Not eligible for the non-commercial tier either - the prohibition is
      on republication of any kind, not on commercial use.

  - name: binary_defense
    credit: "Artillery Threat Intelligence Feed - Binary Defense Systems, binarydefense.com"
    attribution_required: true
    license_url: https://www.binarydefense.com/banlist.txt
    url: https://www.binarydefense.com/banlist.txt
    parser: plain_text
    independence_class: binary_defense
    weight: 0.6
    categories: [scanning, malware-infrastructure]
    ttl_days: 10
    require_user_agent: true
    license: "Public use permitted; commercial resale and fee-charging products prohibited"
    license_risk: medium
    redistribute: true
    notes: >
      3,300 IPs. Returns 301 to an HTML page without a browser-like User-Agent -
      the collector MUST send the configured UA and MUST reject text/html responses.
      NOT redistributed. The terms are non-commercial, and we cannot impose that on
      downstream consumers of a public feed - the same reasoning already applied to
      stopforumspam_toxic. Corrected in ADR-036 after review found the two sources
      carried materially similar terms but opposite redistribute flags.
    notes: >
      3,544 IPs. Returns 301 to an HTML page without a browser-like User-Agent -
      the collector MUST send the configured UA and MUST reject text/html responses.
      REDISTRIBUTED. The feed header reads "Note that this is for public use only"
      and prohibits only "commercial resale or ... products that are charging fees",
      glossed as "(having others pay for a service)". There is no redistribution
      restriction. ADR-036 wrongly inferred one from the word "non-commercial";
      corrected in ADR-039 after reading the actual header text.

  - name: bruteforceblocker
    credit: "bruteforceblocker - Daniel Gerzo, danger.rulez.sk"
    attribution_required: true
    license_url: http://danger.rulez.sk/index.php/bruteforceblocker/
    license: "No licence stated. Published for public use by the bruteforceblocker project; we asked for an explicit statement (ADR-043)"
    url: https://danger.rulez.sk/projects/bruteforceblocker/blist.php
    parser: bruteforceblocker
    independence_class: bruteforceblocker
    weight: 0.6
    categories: [brute-force, ssh-attack]
    ttl_days: 10
    notes: "549 IPs. Tab-separated: ip, last-seen, count. Upstream of ET compromised-ips."

  - name: abuseipdb_blacklist
    url: https://api.abuseipdb.com/api/v2/blacklist
    parser: abuseipdb
    auth: header
    auth_header: Key
    auth_secret: ABUSEIPDB_API_KEY
    params:
      confidenceMinimum: 100    # free tier cannot lower this
      limit: 10000              # free tier hard cap
    independence_class: abuseipdb
    weight: 0.9
    categories: [reported-abuse]
    ttl_days: 10
    min_interval_seconds: 21600   # 5 blacklist calls/day on free tier -> 6h floor
    cache_response: true
    license: "AbuseIPDB free tier; redistribution of the blacklist is restricted"
    license_url: https://www.abuseipdb.com/legal
    redistribute: false
    enabled: true    # key verified 2026-08-14; skips cleanly if ABUSEIPDB_API_KEY is unset
    notes: >
      Free tier: 5 blacklist calls/day, 10,000 IPs, confidenceMinimum locked at 100.
      redistribute:false by default - AbuseIPDB terms restrict republishing their
      blacklist verbatim. Used as a scoring/corroboration signal only until the
      terms are confirmed in writing. See docs/DECISIONS.md ADR-012.
      Enabled without the key present is safe: the collector reports
      skipped_no_credential and the run degrades to the other sources.

  - name: stopforumspam_listed
    url: https://www.stopforumspam.com/downloads/listed_ip_30_ipv46.gz
    parser: plain_text
    gzipped: true
    independence_class: stopforumspam
    weight: 0.5
    vote: true
    categories: [spam-source, abuse]
    ttl_days: 14
    license: "Custom CC variant (NO CC version named): NonCommercial AND No Derivative Works"
    license_url: https://www.stopforumspam.com/license
    license_risk: high
    redistribute: false
    redistribute_noncommercial: false
    noncommercial_compatible: false
    enabled: true
    min_interval_seconds: 43200
    cache_response: true
    notes: >
      COMPLIANCE DOWNGRADE plus a 912x volume increase, in the same change.
      We were publishing this in the non-commercial tier. Re-reading
      stopforumspam.com/license on 2026-08-14, that is not defensible. The page
      grants "To Share - to copy, distribute and transmit the work" and then
      immediately says, under No Derivative Works: "You may not alter, transform, or
      build upon this work, nor use any manual or automated tools or system to
      mirror, copy, scan, duplicate, backup, distribute, scrap or spider any of the
      data on this website". Those two clauses contradict each other, and "build upon
      this work" describes an aggregated feed exactly. Under AGENTS.md we bias toward
      publishing less, so: scoring only, in BOTH tiers.
      Because nothing is republished, volume is now free. We were reading
      toxic_ip_cidr.txt - 60 CIDRs. This reads listed_ip_30_ipv46.gz - 54,710 IPv4
      and IPv6 addresses last seen within 30 days, the same site-wide licence, one
      fetch. Their own downloads page defines the window as a last-seen recency
      window, which is exactly the semantics we want.
      OPERATIONAL LIMITS, both real: the listed_* files are capped at 2 downloads per
      IP per day, hence min_interval_seconds 43200 - four scheduled runs then make
      two real fetches and serve the cache twice. Separately the site sits behind
      Cloudflare and answers bursts with 429 "error code: 1015", counting HEAD
      requests, so never fan out across their files in parallel.
      Note their NonCommercial clause is narrower than most: "You may use this work
      on commercial sites however you cannot resell any information gathered from
      this site". It restricts resale, not commercial use. That does not rescue
      redistribution, because No Derivative Works is the binding clause here.
      RE-REVIEWED 2026-08-15, decision unchanged. Do NOT resolve this to CC BY-NC-ND:
      the page names no Creative Commons version and says they changed it "just a
      little", so CC 4.0's Collection-vs-Adaptation rules - under which mere collection
      is not adaptation, and which would arguably permit republication - do not apply.
      The decisive and simplest reason it cannot enter feeds/noncommercial/ is outbound:
      that tier is published CC BY-NC-SA 4.0, and ShareAlike grants downstream adaptation
      rights we were never granted. Mirror image of the ipthreat exclusion in ADR-041.
      Their NonCommercial clause is NOT the obstacle - it bars resale and misattribution,
      not commercial use - so waiving No Derivative Works alone would unblock a lot.

  - name: ipthreat
    credit: "Data sourced from IPThreat located at https://ipthreat.net"
    attribution_required: true
    url: https://lists.ipthreat.net/file/ipthreat-lists/threat/threat-0.txt
    parser: ipthreat
    explicit_grant: true   # CC BY(-SA) - ipthreat.net/license: re-use and re-mix permitted, even commercially, with attribution and share-alike
    min_score: 15
    independence_class: ipthreat
    weight: 0.8
    categories: [reported-abuse, scanning]
    ttl_days: 10
    license: "Creative Commons attribution; derived data under the same CC licence"
    license_url: https://ipthreat.net/license
    license_risk: low
    redistribute: true
    enabled: true
    min_interval_seconds: 3600
    notes: >
      RENAMED from ipthreat_30d, because that name encoded a misreading. The N in
      ipthreat's threat-N.txt is a MINIMUM SCORE, not a number of days - verified
      2026-08-14: threat-0 has a minimum row score of 0, threat-30 a minimum of 30,
      and the files get SMALLER as N rises, which a day-window would not do. We were
      fetching threat-30.txt believing it was a 30-day window and thereby discarding
      96% of the feed.
      Now fetches threat-0.txt, the full corpus, and applies the floor locally via
      min_score so the threshold is a reviewable number instead of a URL nobody
      re-reads. Measured score distribution on 2026-08-14 of 57,806 rows:
      score>=0 57,806 / >=1 23,716 / >=5 9,869 / >=15 4,996 / >=30 2,365.
      min_score is 15, and the anchor for that number is this project's own stated
      expectation, not taste. README/ADR-015 predict a high-confidence feed of roughly
      2,000-4,000 entries. Measured end-to-end on 2026-08-14:
        min_score 30 -> 2,281 rows -> 3,187 high   (inside the range)
        min_score 15 -> 4,787 rows -> 3,838 high   (inside the range, chosen)
        min_score  5 -> 9,329 rows -> 4,605 high   (breaks it)
        min_score  1 -> 22,330 rows -> 6,108 high  (breaks it badly, +118%)
      15 roughly doubles coverage against the old effective threshold of 30 while
      keeping the feed inside the range the project committed to. Scores below 15 are
      91% of the corpus and are dominated by single low-confidence observations;
      granting those a full class vote is the mistake that keeps sefinek disabled.
      Lowering this further is a deliberate policy change, not a tuning tweak: it
      needs its own churn measurement, because band assignment counts CLASSES and not
      weights, so a low-score row admits exactly as hard as a high-score one.
      See ADR-050.
      Renaming costs one run of carried observations under the old key, which
      degrades gracefully by design (ADR-037).

  - name: ipsum_levels
    credit: "IPsum - Miroslav Stampar (stamparm), github.com/stamparm/ipsum"
    attribution_required: true
    license_url: https://raw.githubusercontent.com/stamparm/ipsum/master/LICENSE
    license: "The Unlicense (public domain dedication)"
    url: https://raw.githubusercontent.com/stamparm/ipsum/master/levels/{level}.txt
    parser: ipsum_levels
    levels: [3, 4, 5, 6, 7, 8]
    independence_class: META_aggregate
    weight: 0.0
    vote: false
    categories: [aggregate]
    notes: >
      IPsum aggregates 30+ public lists including most of ours - counting it as a
      vote double-counts. Levels are strictly nested (verified: L8 subset of L5
      subset of L3) and the level number IS the upstream corroboration count.
      Used as a Bayesian prior only: level>=5 adds a bounded bonus, never a vote.
      Sizes: L3=17,078 L4=7,045 L5=2,092 L6=517 L7=131 L8=31.

  - name: firehol_level1
    url: https://iplists.firehol.org/files/firehol_level1.netset
    parser: netset
    independence_class: META_aggregate
    weight: 0.0
    vote: false
    redistribute: false
    categories: [aggregate]
    enabled: false
    notes: >
      DISABLED. Its own header declares it is composed of dshield + feodo +
      fullbogons + spamhaus_drop - every one already a direct source here.
      It also carries 224.0.0.0/3 (536,870,912 addresses, multicast/reserved)
      and 615 routable blocks wider than /22 totalling ~557M addresses.
      Blindly merging it would be catastrophic. Retained only as an optional
      offline cross-check. See docs/DECISIONS.md ADR-011.

  # ------------------------------------------------ excluded, kept documented
  - name: et_compromised
    url: https://rules.emergingthreats.net/blockrules/compromised-ips.txt
    parser: plain_text
    credit: "Emerging Threats Open ruleset - Copyright (c) 2003-2026, Emerging Threats. All rights reserved."
    attribution_required: true
    license: "BSD 3-clause (Emerging Threats Open ruleset, sids 2000000-2799999)"
    license_url: https://rules.emergingthreats.net/open/suricata-5.0/rules/LICENSE
    license_risk: low
    explicit_grant: true   # BSD 3-clause - Emerging Threats open ruleset LICENSE, sids 2000000-2799999
    independence_class: bruteforceblocker   # same class - NOT independent
    weight: 0.6
    vote: true
    enabled: true
    notes: >
      A DUPLICATE of bruteforceblocker for scoring purposes: measured Jaccard 0.953
      (531 of 539 IPs identical). It is a mirror, not a second opinion, and it is
      class-pinned to bruteforceblocker so it can never double-vote.
      ENABLED in ADR-051 for a reason that did not exist before: the clean tier.
      It stays class-pinned to bruteforceblocker, so it adds NO vote to the primary
      feed - Jaccard 0.953 against bruteforceblocker, it is a mirror. But
      bruteforceblocker publishes no licence at all, while this file is covered by
      the Emerging Threats BSD 3-clause ruleset licence. So in the clean tier, where
      bruteforceblocker is excluded for having no grant, this becomes the sole
      member of its class and contributes the third citable-licence class the tier
      needs to corroborate anything at all.
      Costs nothing, unlocks the tier. If it were not class-pinned this would be
      double-counting, so do not remove that pin.

  - name: dshield_block
    credit: "DShield.org Recommended Block List - SANS Internet Storm Center (CC BY-NC-SA)"
    url: https://feeds.dshield.org/block.txt
    parser: dshield
    independence_class: dshield
    weight: 0.5
    vote: true
    categories: [scanning, reported-abuse]
    ttl_days: 3
    redistribute: false
    redistribute_noncommercial: true
    attribution_required: true
    enabled: true
    license: "CC BY-NC-SA (2.5 in the file header, 4.0 on the ISC API page)"
    license_url: https://isc.sans.edu/api/
    license_risk: medium
    min_interval_seconds: 3600
    notes: >
      The top 20 /24 subnets by report volume across the SANS Internet Storm Center
      firewall-log collection - a large, genuinely independent reporter network.
      Re-admitted in ADR-048 after the 2026-08-14 licence re-read. The ISC API page
      says plainly "It is ok to use this data for commercial purposes, for example to
      protect your own company's network. But again: do not resell", under CC BY-NC-SA
      4.0. That is redistributable in the non-commercial tier, exactly as Turris is,
      so redistribute:false + redistribute_noncommercial:true is the most permissive
      setting the licence actually allows.
      WEIGHT IS DELIBERATELY LOW AND TTL SHORT. This feed publishes /24 blocks, not
      addresses, so one vote here covers 256 hosts. It must never be the reason a /24
      is published: it needs a second class, and the CIDR width cap and allowlist both
      still apply after it.
      Do NOT use isc.sans.edu/api/threatlist/dshield?json - it returned an empty
      array on 2026-08-14. feeds.dshield.org/block.txt is the live path.

  - name: turris_greylist
    credit: "Turris Sentinel greylist - CZ.NIC, view.sentinel.turris.cz (CC BY-NC-SA 4.0)"
    redistribute_noncommercial: true
    url: https://view.sentinel.turris.cz/greylist-data/greylist-latest.csv
    parser: turris_greylist
    independence_class: turris
    weight: 0.7
    categories: [brute-force, scanning]
    ttl_days: 7
    license: "CC BY-NC-SA 4.0"
    license_url: https://view.sentinel.turris.cz/greylist-data/LICENSE.txt
    license_risk: medium
    attribution_required: true
    redistribute: false
    notes: >
      ~9,500 addresses from the CZ.NIC Turris consumer-router sensor network. A
      genuinely different vantage point from the server-side honeypots that dominate
      the rest of the set: 7.7% overlap with our published feed.
      NOT in the primary feed - CC BY-NC-SA cannot be imposed on consumers of a
      public feed. It corroborates there under ADR-035 (upgrade only, name withheld),
      and is republished in FULL in the non-commercial tier, which is itself licensed
      CC BY-NC-SA 4.0 with attribution. See ADR-041.

  - name: dataplane_sshpwauth
    url: https://dataplane.org/sshpwauth.txt
    parser: dataplane
    independence_class: dataplane
    weight: 0.7
    vote: true
    categories: [ssh-attack, brute-force]
    ttl_days: 7
    redistribute: false
    redistribute_noncommercial: false
    noncommercial_compatible: false
    enabled: true
    license: "Non-commercial use only; redistribution expressly prohibited"
    license_url: https://dataplane.org/sshpwauth.txt
    license_risk: medium
    min_interval_seconds: 3600
    notes: >
      ~9,800 addresses seen attempting SSH password authentication against the
      Dataplane.org sensor network, on a rolling 7-day window, refreshed hourly.
      Original sensor telemetry from a 501(c)(3) - one of the few remaining feeds
      that is not downstream of anything else in this set.
      SCORING ONLY, IN BOTH TIERS. The payload states "Redistribution of the
      sshpwauth report in whole or in part without the express permission of
      Dataplane.org is expressly prohibited", so no row from it is emitted anywhere:
      redistribute:false AND noncommercial_compatible:false. What the header DOES
      permit is use - "free for non-commercial use ONLY" - and this project is free
      and sells nothing, so consuming it to corroborate other sources is inside the
      terms. Same posture as greensnow and abuseipdb. Enabled in ADR-048, reversing
      the blanket exclusion; the earlier note conflated "may not republish" with
      "may not read".
      Also note their own caveat: "This report is informational. This is not a block
      list." Hence a vote, not a promotion.

  - name: dataplane_telnetlogin
    url: https://dataplane.org/signals/telnetlogin.txt
