  - name: tor_exits
    credit: "Tor exit relay list - The Tor Project, torproject.org"
    attribution_required: true
    license_url: https://check.torproject.org/torbulkexitlist
    license: "No licence stated on the endpoint. Published by the Tor Project as a public service"
    url: https://check.torproject.org/torbulkexitlist
    parser: plain_text
    independence_class: tor
    weight: 0.0
    vote: false
    tag_only: true
    categories: [tor-exit]
    ttl_days: 2
    notes: >
      1,367 exits. NEVER blocked, NEVER scored - tagged only. Measured
      contamination in other feeds: IPsum L3 lists 265 of them, binary_defense 64,
      blocklist_de 49, greensnow 48. Any IP tagged tor-exit is capped below the
      high-confidence threshold. See docs/DECISIONS.md ADR-013.
      NOT in the clean tier, deliberately. The Tor Project declares CC0 for "data on
      this site" at metrics.torproject.org/about.html, but the bulk exit list is
      served from check.torproject.org with no licence text of any kind, and the
      canonical LICENSE in their GitLab was unreachable on both 2026-08-13 and
      2026-08-14. Inferring a grant across hosts is exactly the reasoning the clean
      tier exists to refuse, so explicit_grant stays false. It costs nothing here:
      this source is tag-only and casts no vote.

