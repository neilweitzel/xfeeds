name: Keepalive

# GitHub disables scheduled workflows in a public repository after 60 days with
# no repository activity. Under healthy operation "Update feeds" commits roughly
# four times a day, so that clock never gets close to expiring and this workflow
# does nothing.
#
# The failure it exists for is the compounding one. "Update feeds" only commits
# when the run succeeds (its commit step is gated on exit_code == '0'), so a
# pipeline that is failing - a tripped churn guard, a parser regression, an
# expired key - stops committing entirely. If nobody notices for 60 days, GitHub
# disables the cron and the project goes from "broken and retrying" to "broken
# and not even trying", which is far harder to spot and needs a manual re-enable.
#
# So this commits a timestamp only when the repository has actually gone quiet.
# Threshold is 14 days against GitHub's 60, which leaves four further weekly
# attempts before the deadline if one of them fails.

on:
  schedule:
    # Sunday 03:41 UTC. Off the hour, and well away from the :17 feed refresh.
    - cron: "41 3 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: "Commit even if the repository is not quiet yet"
        type: boolean
        default: false

# Never race the feed refresh for the push. This workflow is not urgent - if a
# refresh is mid-flight, waiting is strictly better than fighting it.
concurrency:
  group: repo-push
  cancel-in-progress: false

permissions:
  contents: write

env:
  QUIET_DAYS: 14

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Need enough history to read the real timestamp of the last commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Decide whether the repository has gone quiet
        id: check
        run: |
          last_commit_epoch=$(git log -1 --format=%ct)
          now_epoch=$(date -u +%s)
          age_days=$(( (now_epoch - last_commit_epoch) / 86400 ))
          echo "Last commit was ${age_days} day(s) ago (threshold ${QUIET_DAYS})."
          echo "age_days=${age_days}" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.force }}" = "true" ] || [ "${age_days}" -ge "${QUIET_DAYS}" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Repository is active; no keepalive commit needed."
          fi

      - name: Commit a keepalive timestamp
        if: steps.check.outputs.needed == 'true'
        env:
          AGE_DAYS: ${{ steps.check.outputs.age_days }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A dedicated throwaway file. Deliberately not anything under feeds/,
          # which is regenerated wholesale each run and would make this show up
          # as feed churn.
          # Built with echo rather than a heredoc: inside a YAML block scalar a
          # heredoc body keeps its indentation, which would end up in the file.
          mkdir -p .github
          {
            echo "This file exists only to keep the scheduled workflows alive."
            echo ""
            echo "GitHub disables scheduled workflows in a public repository after"
            echo "60 days with no repository activity. 'Update feeds' normally"
            echo "supplies that activity by committing refreshed feeds, but it does"
            echo "not commit when a run fails - so a long outage would otherwise"
            echo "cost us the cron as well as the feed."
            echo ""
            echo "Nothing reads this file. See .github/workflows/keepalive.yml."
            echo ""
            echo "Last touched: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Reason: no repository commit in ${AGE_DAYS} day(s)"
          } > .github/keepalive.txt

          git add .github/keepalive.txt
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore: keepalive after ${AGE_DAYS} quiet day(s)" -m \
          "No commit landed in ${AGE_DAYS} days, which usually means the feed refresh
          has been failing. Committing so GitHub does not also disable the
          scheduled workflows at the 60-day inactivity mark."

          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected (attempt ${attempt}/3); rebasing onto origin/main."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; true; }
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the keepalive commit after 3 attempts."
          exit 1

      # A quiet repository means the pipeline has probably been broken for two
      # weeks. The keepalive protects the cron; it does not fix anything, so say
      # so loudly rather than letting a silent commit imply health.
      - name: Flag the underlying outage
        if: steps.check.outputs.needed == 'true' && inputs.force != true
        uses: actions/github-script@v7
        env:
          AGE_DAYS: ${{ steps.check.outputs.age_days }}
        with:
          script: |
            const days = process.env.AGE_DAYS;
            const title = 'xfeeds: repository quiet, keepalive fired';
            const body = [
              `No commit has landed in **${days} days**. Under normal operation the`,
              'feed refresh commits about four times a day, so this means the',
              'pipeline has been failing or not running for some time.',
              '',
              'A keepalive commit was made so GitHub does not disable the scheduled',
              'workflows at the 60-day mark. **That protects the cron, it does not',
              'fix the pipeline.**',
              '',
              'Check the Actions tab for failing "Update feeds" runs, and look for an',
              'open `xfeeds: feed refresh failed` or `xfeeds: churn guard tripped` issue.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`
                + `/actions/runs/${context.runId}`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'automated',
            });
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: match.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['automated'],
              });
            }
