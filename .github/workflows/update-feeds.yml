name: Update feeds

# The target cadence is every 6 hours, set by the tightest external constraint:
# AbuseIPDB allows 5 blacklist calls per day on the free tier, and Spamhaus
# requires automated fetches at least an hour apart. Offset off the hour so we
# are not part of a thundering herd hitting these upstreams on the hour.
#
# But the trigger fires every 3 hours, not every 6. GitHub's scheduler is
# best-effort and drops slots under load: across 2026-08-27 to 2026-09-01 only
# one day in six saw all four runs, the median gap stretched to 8.26h, and the
# worst reached 13.79h (#50). A dropped 6-hourly slot meant waiting 12 hours.
#
# Firing every 3 hours lets a dropped slot be picked up 3 hours later instead of
# 6. The extra slots do not mean extra fetches - the guard below stands most of
# them down before any upstream is contacted, holding the *actual* refresh rate
# at 4 per day and at least 4 hours apart. That is stricter than both external
# limits, so a scheduler that misbehaves costs us freshness, never a rate limit
# (ADR-062).
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass the churn guard (use when a large change is expected)"
        type: boolean
        default: false
      backfill_sightings:
        description: "Re-seed the repeat-sighting window from source archives (ADR-061)"
        type: boolean
        default: false

# A run in progress is always less valuable than the newest one.
concurrency:
  group: update-feeds
  cancel-in-progress: true

# Pages permissions are needed because this workflow deploys the site itself.
# A push made with GITHUB_TOKEN does NOT trigger other workflows - GitHub blocks
# that to prevent recursion - so relying on pages.yml to fire on our own commit
# would leave the published dashboard permanently stale.
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      # Full history so the push-retry below can rebase onto origin/main. A
      # shallow clone cannot always find a merge base to rebase against.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install Python and dependencies
        run: |
          uv python install 3.13
          uv sync --dev

      # Restores both the HTTP conditional-request cache and the run state that
      # carries first_seen forward. A cold cache degrades gracefully: state is
      # reseeded from the committed feeds/all.json.
      - name: Restore caches
        uses: actions/cache@v4
        with:
          path: .cache
          key: xfeeds-cache-${{ github.run_id }}
          restore-keys: |
            xfeeds-cache-

      # Stand down unless a refresh is actually due. Reads the commit history of
      # feeds/manifest.json rather than the Actions run list, because every
      # successful refresh commits a new generated_at while a stood-down run
      # commits nothing - so the history counts real refreshes, not triggers.
      #
      # Both bounds exist to protect a different upstream promise, and both are
      # deliberately stricter than the promise itself:
      #   * at most 4 in 24h  -> AbuseIPDB's free tier allows 5
      #   * at least 4h apart -> Spamhaus asks for at least 1h
      - name: Decide whether a refresh is due
        id: due
        if: github.event_name == 'schedule'
        run: |
          LAST=$(git log -1 --format=%ct -- feeds/manifest.json)
          COUNT=$(git log --since='24 hours ago' --format=%ct -- feeds/manifest.json | wc -l)
          NOW=$(date -u +%s)
          AGE=$(( (NOW - LAST) / 60 ))
          echo "Last refresh ${AGE} minutes ago; ${COUNT} in the last 24h."
          if [ "$COUNT" -ge 4 ]; then
            echo "::notice::Standing down - already 4 refreshes in the last 24h."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$AGE" -lt 240 ]; then
            echo "::notice::Standing down - last refresh was ${AGE}m ago, minimum spacing is 240m."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # The sighting window lives in .cache and is rebuilt by accumulation, so a
      # lost Actions cache silently costs a month of history (ADR-061). This is
      # the recovery path, and the reason the script exists at all: without a way
      # to run it where the cache lives, it could only ever help a local checkout.
      - name: Re-seed the sighting window
        if: inputs.backfill_sightings
        run: uv run python scripts/backfill_sighting_window.py --source turris_greylist

      - name: Refresh feeds
        id: refresh
        if: steps.due.outputs.skip != 'true'
        env:
          ABUSEIPDB_API_KEY: ${{ secrets.ABUSEIPDB_API_KEY }}
          THREATFOX_AUTH_KEY: ${{ secrets.THREATFOX_AUTH_KEY }}
          # Optional enrichment. Absent or rate-limited, the run caps nothing and
          # completes normally - see src/xfeeds/greynoise.py.
          GREYNOISE_API_KEY: ${{ secrets.GREYNOISE_API_KEY }}
        run: |
          set +e
          uv run xfeeds run ${{ inputs.force && '--force' || '' }} 2>&1 | tee run.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Commit refreshed feeds
        id: commit
        if: steps.due.outputs.skip != 'true' && steps.refresh.outputs.exit_code == '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds/
          if git diff --cached --quiet; then
            echo "No change in feeds; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          ADDED=$(grep -oP '\+\K[0-9]+(?= / -)' run.log | head -1 || echo 0)
          REMOVED=$(grep -oP '/ -\K[0-9]+' run.log | head -1 || echo 0)
          git commit -m "chore(feeds): refresh $(date -u +%Y-%m-%dT%H:%MZ) (+${ADDED}/-${REMOVED})"

          # A manual dispatch and a queued scheduled run can both target main,
          # and a run held by the concurrency group keeps the checkout it
          # resolved at queue time - so by the time it pushes, main may have
          # moved. Rebase and retry instead of failing the whole run.
          #
          # -X theirs resolves in favour of the commit being replayed (ours),
          # not the upstream one. That is what we want: feeds/ is regenerated
          # wholesale each run, so the newer snapshot supersedes the older one
          # rather than merging with it.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}/3); rebasing onto origin/main."
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; true; }
            sleep $((attempt * 5))
          done
          echo "::error::Could not push refreshed feeds after 3 attempts."
          exit 1

      # A tripped churn guard (exit 2) means an upstream probably broke. Surface
      # it as an issue rather than failing silently in the Actions tab.
      - name: Report a problem
        if: steps.due.outputs.skip != 'true' && steps.refresh.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('run.log', 'utf8').slice(-8000);
            const code = '${{ steps.refresh.outputs.exit_code }}';
            const title = code === '2'
              ? 'xfeeds: churn guard tripped'
              : 'xfeeds: feed refresh failed';
            const body = [
              code === '2'
                ? 'The run would have changed more than 25% of the high-confidence feed, '
                  + 'so it was aborted and the existing feeds were left untouched. '
                  + 'This usually means an upstream source broke or a parser regressed.'
                : 'The scheduled feed refresh failed.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`
                + `/actions/runs/${context.runId}`,
              '',
              '<details><summary>Log tail</summary>',
              '',
              '```',
              log,
              '```',
              '</details>',
            ].join('\n');

            // Update the existing open issue instead of opening a duplicate on
            // every refresh - a broken upstream would otherwise create four a day.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'automated',
            });
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: match.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['automated'],
              });
            }
            core.setFailed(`xfeeds run exited ${code}`);

  # Deploy from inside this workflow rather than depending on pages.yml, which a
  # GITHUB_TOKEN push cannot trigger. This is the primary publish path; pages.yml
  # picks up after us on workflow_run if this job fails or is cancelled.
  deploy-pages:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # Shares pages.yml's group so the two publishers can never deploy at once.
    # Without this they were in different groups entirely, and a manual "Publish
    # to Pages" run overlapping a scheduled refresh could land the older artifact
    # last. cancel-in-progress stays false: a half-finished Pages deployment is
    # worse than a queued one.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main   # pick up the commit the refresh job just pushed

      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r feeds/* _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
