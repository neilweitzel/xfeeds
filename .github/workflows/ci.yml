name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.python-version == '3.14' }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run linter
        run: uv run ruff check .

      - name: Run type checker
        run: uv run mypy --strict src tests

      - name: Run tests
        run: uv run pytest

      - name: Validate source registry
        run: uv run xfeeds validate

  citation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate CITATION.cff
        uses: citation-file-format/cffconvert-github-action@2.0.0
        with:
          args: "--validate"

      - name: Validate .zenodo.json
        run: python -c "import json, pathlib; json.loads(pathlib.Path('.zenodo.json').read_text())"

      - name: Check citation metadata agrees on ORCID and licence
        run: |
          set -euo pipefail
          orcid="0009-0007-2546-2331"
          grep -q "https://orcid.org/${orcid}" CITATION.cff
          grep -q "\"${orcid}\"" .zenodo.json
          grep -q '^license: MIT$' CITATION.cff
          grep -q '"license": "MIT"' .zenodo.json
          grep -q '^license = "MIT"$' pyproject.toml
