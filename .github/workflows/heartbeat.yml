name: Heartbeat

# Outcome monitoring stays inside GitHub. A GitHub-wide scheduler outage can
# delay this check too; keepalive.yml protects against inactivity disablement.
on:
  schedule:
    # Best-effort scheduler opportunity, not a guarantee of execution time.
    - cron: "47 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Serialize incident updates so manual/scheduled runs cannot create duplicates
# or let an older observation close a newer incident.
concurrency:
  group: heartbeat
  cancel-in-progress: false

env:
  MAX_AGE_HOURS: "24"
  PAGES_URL: "https://neilweitzel.github.io/xfeeds"

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      # Uses only the runner's Python stdlib and curl. At most three requests,
      # each bounded to 30s (35s outer deadline), plus 5s/10s backoff.
      - name: Measure feed health
        run: python3 src/xfeeds/heartbeat.py

      - name: Update heartbeat incident
        uses: actions/github-script@v7
        with:
          script: |
            const report = JSON.parse(require('fs').readFileSync('heartbeat-report.json', 'utf8'));
            await require('./.github/scripts/heartbeat.cjs')({ github, context, core, report });
